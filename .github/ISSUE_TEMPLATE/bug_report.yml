name: Bug report
description: Create a report to help us improve or fix something
labels: ['bug', 'need repro']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out a bug report!

        Before submitting, please [search existing issues](https://github.com/issues?q=is%3Aissue+org%3AQbox-project) and confirm you are on the **latest release** of the resource. Duplicate or already-fixed issues will be closed.

        Please use our [Discord server](https://discord.gg/Z6Whda5hHA) to ask questions and receive support — issues are not for general questions.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Write a short and concise description of your bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: What did you do to make this happen?
      placeholder: |
        1. Using ...
        2. Do ...
        3. Then use ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Client/Server console output
      description: Paste any relevant F8 client console or server console errors here.
      placeholder: |
        Client:
        ...

        Server:
        ...
  - type: input
    id: updated
    attributes:
      label: Resource Version
      description: What version of this resource are you using? Use the release tag or the version in fxmanifest.lua.
      placeholder: e.g. v1.3.0
    validations:
      required: true
  - type: input
    id: qbx_core
    attributes:
      label: qbx_core Version
      description: What version of qbx_core are you running? Leave blank if unknown.
      placeholder: e.g. v1.23.0
  - type: input
    id: custom
    attributes:
      label: Custom Resources
      description: List any custom or third-party resources that may be relevant to this bug.
      placeholder: None, or e.g. ox_target, ox_inventory
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: If you have any other context about the problem such as screenshots or videos, add them here.
