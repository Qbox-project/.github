name: Feature request
description: Suggest an idea for Qbox
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest an improvement!

        For large features or design changes, please discuss your idea on the [Qbox Discord server](https://discord.gg/Z6Whda5hHA) first to make sure it fits the project before opening an issue.

        Please use Discord for questions and support — issues are not for general questions.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: A clear and concise description of what the problem is, or what feature you want to be implemented.
      placeholder: |
        Some examples:
        I'm frustrated that ...
        It would be nice if ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Ideal solution
      description: A clear and concise description of what you want to happen, with as much detail as possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative solutions
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: If you have any other context about the problem such as screenshots or videos, add them here.
